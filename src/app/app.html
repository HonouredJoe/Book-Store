<div class="navbar">

    <div class="logo">

        📚 Book Store

    </div>

    <div class="menu">

        <button
            [class.active]="screen()=='book-list'"
            (click)="screen.set('book-list')">

            Books

        </button>

        <button
            [class.active]="screen()=='order-list'"
            (click)="screen.set('order-list')">

            Orders

        </button>

    </div>

</div>

<div class="page">

@switch(screen()) {

  @case('book-list') {

    <app-book-list
      (addClicked)="selectedBook.set(null); screen.set('book-form')"
      (editClicked)="selectedBook.set($event); screen.set('book-form')"
      (viewClicked)="selectedBook.set($event); screen.set('book-details')">
    </app-book-list>

  }

  @case('book-form') {

    <app-book-form
      [book]="selectedBook()"
      (cancelClicked)="screen.set('book-list')">
    </app-book-form>

  }

  @case('book-details') {

    <app-book-details
      [book]="selectedBook()"
      (backClicked)="screen.set('book-list')">
    </app-book-details>

  }

  @case('order-list') {

    <app-order-list
      (addClicked)="screen.set('order-form')"
      (viewClicked)="selectedOrder.set($event); screen.set('order-details')">
    </app-order-list>

  }

  @case('order-form') {

    <app-order-form
      (cancelClicked)="screen.set('order-list')">
    </app-order-form>

  }

  @case('order-details') {

    <app-order-details
      [order]="selectedOrder()"
      (backClicked)="screen.set('order-list')">
    </app-order-details>

  }

}

</div>
