<mat-card class="container">
  <h1>Add New Book</h1>

  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input #titleInput matInput type="text" [(ngModel)]="title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ISBN</mat-label>
      <input matInput type="text" [(ngModel)]="isbn" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Author</mat-label>
      <input matInput type="text" [(ngModel)]="author" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price</mat-label>
      <input matInput type="number" [(ngModel)]="price" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" [(ngModel)]="quantity" />
    </mat-form-field>
  </div>

  <div class="buttons">
    <button mat-flat-button color="primary" (click)="saveBook()">Save Book</button>
    <button mat-stroked-button color="warn" (click)="cancel()">Cancel</button>
  </div>
</mat-card>
