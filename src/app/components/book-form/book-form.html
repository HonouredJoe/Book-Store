<div class="container">

    <h1>Add New Book</h1>

    <div class="form-group">

        <label>Title</label>

        <input
            #titleInput
            type="text"
            [(ngModel)]="title">

    </div>

    <div class="form-group">

        <label>ISBN</label>

        <input
            type="text"
            [(ngModel)]="isbn">

    </div>

    <div class="form-group">

        <label>Author</label>

        <input
            type="text"
            [(ngModel)]="author">

    </div>

    <div class="form-group">

        <label>Price</label>

        <input
            type="number"
            [(ngModel)]="price">

    </div>

    <div class="form-group">

        <label>Quantity</label>

        <input
            type="number"
            [(ngModel)]="quantity">

    </div>

    <div class="buttons">

        <button class="save"
            (click)="saveBook()">
            Save Book
        </button>

        <button class="cancel"
            (click)="cancel()">
            Cancel
        </button>

    </div>

</div>
