<div class="container">

<div class="header">

<h1>Orders</h1>

<button
class="add-btn"
(click)="addOrder()">

+ New Order

</button>

</div>

<table>

<thead>

<tr>

<th>Order ID</th>

<th>Date</th>

<th>Items</th>

<th>Total</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

@for(order of orderstore.orders(); track order.id){

<tr>

<td>#{{order.id}}</td>

<td>{{order.date}}</td>

<td>{{getItems(order)}}</td>

<td>${{getTotal(order)}}</td>

<td>

<button
class="view"
(click)="viewOrder(order)">

View Details

</button>

</td>

</tr>

}

</tbody>

</table>

</div>
