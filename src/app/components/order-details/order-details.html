<mat-card class="container">
  <div class="header">
    <h1>Order #{{ order().id }} Details</h1>
    <button mat-stroked-button color="primary" (click)="back()">Back To Orders</button>
  </div>

  <p class="date">Placed on: {{ order().date }}</p>

  <div class="table-wrap">
    <table mat-table [dataSource]="order().items" class="order-table">
      <ng-container matColumnDef="book">
        <th mat-header-cell *matHeaderCellDef>Book</th>
        <td mat-cell *matCellDef="let item">{{ item.book.title }}</td>
      </ng-container>

      <ng-container matColumnDef="unitPrice">
        <th mat-header-cell *matHeaderCellDef>Unit Price</th>
        <td mat-cell *matCellDef="let item">${{ item.book.price }}</td>
      </ng-container>

      <ng-container matColumnDef="qty">
        <th mat-header-cell *matHeaderCellDef>Qty</th>
        <td mat-cell *matCellDef="let item">{{ item.quantity }}</td>
      </ng-container>

      <ng-container matColumnDef="subtotal">
        <th mat-header-cell *matHeaderCellDef>Subtotal</th>
        <td mat-cell *matCellDef="let item">${{ getSubtotal(item) }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <div class="total">Order Total: ${{ getTotal() }}</div>
</mat-card>
